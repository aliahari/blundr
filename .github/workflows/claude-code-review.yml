name: Claude Code Review

# Claude reviews every pull request against main when it's opened, updated,
# reopened or marked ready, and posts the findings on the PR (inline comments,
# or one summary comment when it finds nothing). It only reads the code and
# comments; it never pushes. Based on the official example:
# https://code.claude.com/docs/en/github-actions
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (create it with
# `claude setup-token`, which bills reviews to your Claude subscription).
# To use an API key instead, add ANTHROPIC_API_KEY and swap the auth line
# below for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same PR makes the running review stale: cancel it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts aren't ready for review; marking one ready triggers a run.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7 # same major as deploy.yml
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
