name: Claude Code Review

# Claude reviews every pull request against main when it's opened, updated,
# reopened or marked ready, and posts the findings on the PR (inline comments,
# or one summary comment when it finds nothing). It only reads the code and
# comments; it never pushes. Based on the official example:
# https://code.claude.com/docs/en/github-actions
#
# The `review` check is a merge gate: it passes only when Claude reviewed this
# commit and found no issues. `main` requires it (with `test`), and PRs have
# GitHub auto-merge on, so a clean PR merges itself and deploys. Anything
# else (findings, no review, a failed run) leaves the check red and the PR for
# the owner, who can still merge by hand.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (create it with
# `claude setup-token`, which bills reviews to your Claude subscription).
# To use an API key instead, add ANTHROPIC_API_KEY and swap the auth line
# below for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same PR makes the running review stale: cancel it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The code-review plugin skips a PR Claude has already commented on, so a
  # push after fixes would get no new review and could never pass the gate.
  # Remove Claude's earlier summary comments first; inline comment threads
  # from earlier reviews stay.
  clear-previous-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Delete Claude's earlier summary comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq '.[] | select(.user.login == "claude[bot]") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/issues/comments/$id"
            echo "Deleted earlier review comment $id"
          done

  review:
    needs: clear-previous-review
    # Drafts aren't ready for review; marking one ready triggers a run.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Note when this review started
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7 # same major as deploy.yml
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # In this one-shot run nothing wakes Claude up once its turn ends, but the
          # plugin's helper agents can be started in the background (seen on #16:
          # "The eligibility check is still running. I'll wait for its notification").
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a one-shot, non-interactive run: once your turn
            ends, nothing will resume it. Run every subagent in the foreground and wait for
            its result. Never end your turn while a subagent or background task is still
            running. Finish the whole review, including posting it, before you stop."

      # Claude sometimes stops after a turn or two without reviewing (seen on
      # the first run of #11 and #13; a re-run reviewed both). If it posted
      # nothing, print its final message (a short string; the full output
      # stays off because this repo is public) and try once more.
      - name: Check Claude posted a review
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          count=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length" \
            | awk '{s += $1} END {print s + 0}')
          if [ "$count" -gt 0 ]; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "posted=false" >> "$GITHUB_OUTPUT"
          echo "Claude posted no review on the first try. Its final message:"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '(if type == "array" then . else [.] end)
                   | map(select(.type == "result")) | last
                   | (.result // "(no result text)")' "$EXECUTION_FILE" | head -c 2000
          fi

      - uses: anthropics/claude-code-action@v1
        id: claude_retry
        if: steps.posted.outputs.posted == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # In this one-shot run nothing wakes Claude up once its turn ends, but the
          # plugin's helper agents can be started in the background (seen on #16:
          # "The eligibility check is still running. I'll wait for its notification").
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a one-shot, non-interactive run: once your turn
            ends, nothing will resume it. Run every subagent in the foreground and wait for
            its result. Never end your turn while a subagent or background task is still
            running. Finish the whole review, including posting it, before you stop."

      # When a review run itself fails (e.g. an authentication error), print
      # only Claude's final result message, so the cause shows.
      - name: Show why the review failed
        if: failure() && (steps.claude.outcome == 'failure' || steps.claude_retry.outcome == 'failure')
        env:
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: |
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '(if type == "array" then . else [.] end)
                   | map(select(.type == "result")) | last
                   | (.result // "Claude returned no result text")' "$EXECUTION_FILE" | head -c 2000
          else
            echo "No execution log was written."
          fi

      # The merge gate: pass only if this job (either try) posted a
      # "No issues found" summary and no inline findings.
      - name: Pass only when Claude found no issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
        run: |
          summaries=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\") | .body")
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length" \
            | awk '{s += $1} END {print s + 0}')

          if [ -z "$summaries" ]; then
            echo "::error::Claude posted no review for this commit. It skips PRs it judges trivial and PRs that change this workflow. Not auto-merging: merge by hand."
            exit 1
          fi
          if [ "$inline" -gt 0 ] || ! grep -q "No issues found" <<< "$summaries"; then
            echo "::error::Claude found issues in this commit ($inline inline comments). Not auto-merging."
            exit 1
          fi
          echo "Claude reviewed this commit and found no issues."
